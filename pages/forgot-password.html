<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Scilab 3.0 - Science Laboratory Reservation System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/env-loader.js"></script>
    <script src="../config/supabase.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="company-name">
                <h1>Scilab Reserve 2.0</h1>
                <h2>PLSP - Science Laboratory Reservation System</h2>
            </div>
        </div>
        <div class="login-right">
            <div class="login-form-container">
                <div class="user-icon">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="#152614"/>
                        <path d="M12 14C7.58172 14 4 17.5817 4 22H20C20 17.5817 16.4183 14 12 14Z" fill="#152614"/>
                    </svg>
                </div>
                <h2 class="welcome-text">FORGOT PASSWORD</h2>
                <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 0.9rem;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
                <form id="forgotPasswordForm">
                    <div class="input-group">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z" fill="#152614"/>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>
                    </div>
                    <button type="button" id="sendOtpBtn" class="login-btn">SEND OTP</button>
                    
                    <div id="otpSection" style="display: none;">
                        <div class="input-group">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18 8H20C21.1 8 22 8.9 22 10V20C22 21.1 21.1 22 20 22H4C2.9 22 2 21.1 2 20V10C2 8.9 2.9 8 4 8H6V6C6 3.79 7.79 2 10 2H14C16.21 2 18 3.79 18 6V8ZM16 8V6C16 4.9 15.1 4 14 4H10C8.9 4 8 4.9 8 6V8H16ZM4 10V20H20V10H4Z" fill="#152614"/>
                            </svg>
                            <input type="text" id="otp" name="otp" placeholder="Enter OTP Code" required>
                        </div>
                        <button type="button" id="verifyOtpBtn" class="login-btn">VERIFY OTP</button>
                    </div>
                    <div class="signup-link">
                        <p>Remember your password? <a href="../index.html">Back to Login</a></p>
                    </div>
                </form>
                <div id="errorMessage" class="error-message"></div>
            </div>
        </div>
    </div>
    <script src="../js/forgot-password.js"></script>
    <script src="../js/snackbar.js"></script>
    <script src="../js/loading.js"></script>
</body>
</html>
