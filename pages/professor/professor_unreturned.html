<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students with Unreturned Items - Professor</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/sidebar_theme.css">
    <style>
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .dashboard-main {
                margin-left: 0;
            }
            
            .dashboard-sidebar {
                transform: translateX(-100%);
            }
        }

        .student-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
        }

        .student-header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .student-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #152614;
            margin-bottom: 5px;
        }

        .student-info {
            color: #666;
            font-size: 0.9rem;
        }

        .unreturned-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: white;
            border-radius: 5px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: #152614;
            margin-bottom: 5px;
        }

        .item-details {
            color: #666;
            font-size: 0.9rem;
        }

        .unreturned-qty {
            color: #d32f2f;
            font-weight: 600;
        }

        .view-reservation-btn {
            padding: 8px 14px;
            border: 0;
            border-radius: 5px;
            background: #31CB00;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .view-reservation-btn:hover { background: #269d00; }

        .resource-detail-row { padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
        .resource-detail-row:last-child { border-bottom: 0; }
        .resource-detail-name { font-weight: 600; color: #152614; }
        .resource-detail-meta { margin-top: 4px; color: #666; font-size: 0.9rem; }
        .modal-resource-heading { margin: 18px 0 10px; font-weight: 600; color: #152614; }
        .modal-resource-list { display: grid; gap: 10px; }
        .modal-resource-list .resource-detail-row {
            padding: 15px;
            background: #f0f7ee;
            border: 0;
            border-left: 3px solid #31CB00;
            border-radius: 8px;
        }
        .reservation-resource-list { display: grid; gap: 4px; }
        .reservation-resource { line-height: 1.35; }
        .reservation-resource + .reservation-resource { border-top: 1px solid #e5e7eb; padding-top: 4px; }
        .unreturned-quantity-list { display: grid; }
        .unreturned-quantity-item { padding: 4px 0; line-height: 1.35; font-variant-numeric: tabular-nums; }
        .unreturned-quantity-item + .unreturned-quantity-item { padding-top: 6px; border-top: 1px solid #e1e5e9; }
        .unreturned-quantity-list--due { color: #d32f2f; }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <!-- Sidebar will be loaded dynamically -->

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="dashboard-header">
                <div class="header-left">
                    <h1>Students with Unreturned Items</h1>
                    <img src="../../Logo/DLSP_Logo.png" alt="DLSP Logo" class="header-logo">
                </div>
            </div>
            <div class="dashboard-content">
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Student Name</th>
                                <th>Year & Section</th>
                                <th>Resources</th>
                                <th>Borrowed</th>
                                <th>Returned</th>
                                <th>Unreturned</th>
                                <th>Reservation Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="itemsTable">
                            <!-- Data will be loaded dynamically -->
                        </tbody>
                    </table>
                </div>
                <div id="itemsEmptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon"></div>
                    <div class="empty-state-text">No students with unreturned items</div>
                </div>


            </div>
        </main>
    </div>

    <div id="reservationDetailsModal" class="modal">
        <div class="modal-content reservation-dialog-content">
            <div class="modal-header">
                <h2 class="modal-title">Reservation Details</h2>
                <button class="modal-close" type="button" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../js/sidebar_loader.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/modal.js"></script>
    <script src="../../js/professor_unreturned.js"></script>
</body>

</html>
