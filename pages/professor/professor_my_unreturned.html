<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unreturned Items - Professor</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/sidebar_theme.css">
    <style>
        .unreturned-quantity-list { display: grid; }
        .unreturned-quantity-item { padding: 4px 0; line-height: 1.35; font-variant-numeric: tabular-nums; }
        .unreturned-quantity-item + .unreturned-quantity-item { padding-top: 6px; border-top: 1px solid #e1e5e9; }
        .unreturned-quantity-list--due { color: #d32f2f; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <main class="dashboard-main">
            <div class="dashboard-header"><div class="header-left"><h1>My Unreturned Items</h1><img src="../../Logo/DLSP_Logo.png" alt="DLSP Logo" class="header-logo"></div></div>
            <div class="dashboard-content">
                <div class="data-table"><table>
                    <thead><tr><th>Reservation #</th><th>Resources</th><th>Borrowed</th><th>Returned</th><th>Unreturned</th><th>Reservation Date</th></tr></thead>
                    <tbody id="myUnreturnedItemsTable"></tbody>
                </table></div>
                <div id="myUnreturnedEmpty" class="empty-state"><div class="empty-state-text">No unreturned items found</div></div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../js/sidebar_loader.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/professor_my_unreturned.js"></script>
</body>
</html>
