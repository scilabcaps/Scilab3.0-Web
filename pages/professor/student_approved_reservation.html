<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approved Reservations - Professor</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/sidebar_theme.css">
    <style>
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .dashboard-main {
                margin-left: 0;
            }
            
            .dashboard-sidebar {
                transform: translateX(-100%);
            }
        }

        .approval-status { font-weight: 600; }
        .status-approved { color: #119822; }
        .status-declined { color: #dc2626; }
        .status-pending { color: #f59e0b; }
        .status-unknown { color: #6b7280; }
        .modal-resource-heading { margin: 18px 0 10px; color: #152614; }
        .modal-resource-list { display: grid; gap: 10px; }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar will be loaded dynamically -->

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="dashboard-header">
                <div class="header-left">
                    <h1>Student Approved Reservations</h1>
                    <img src="../../Logo/DLSP_Logo.png" alt="DLSP Logo" class="header-logo">
                </div>
            </div>
            <div class="dashboard-content">
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Resources</th>
                                <th>Student</th>
                                <th>Additional Note</th>
                                <th>Admin Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reservationsTable">
                            <!-- Data will be loaded dynamically -->
                        </tbody>
                    </table>
                </div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon"></div>
                    <div class="empty-state-text">No approved or declined reservations</div>
                </div>
            </div>
        </main>
    </div>
    <div id="approvedReservationModal" class="modal">
        <div class="modal-content reservation-dialog-content">
            <div class="modal-header">
                <h2 class="modal-title">Reservation Details</h2>
                <button class="modal-close" type="button" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body"><!-- Reservation details load here --></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../js/sidebar_loader.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/modal.js"></script>
    <script src="../../js/professor_approved.js"></script>
</body>

</html>
