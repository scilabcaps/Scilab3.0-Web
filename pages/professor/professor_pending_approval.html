<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Admin Approval</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/sidebar_theme.css">
    <style>
        /* Resource Tabs Styles */
        .resource-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 20px;
            border: 2px solid #e9ecef;
            background: #ffffff;
            color: #666;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: #f0f7ee;
            border-color: #31CB00;
            color: #2A7221;
        }

        .tab-btn.active {
            background: rgba(49, 203, 0, 0.15);
            border-color: #31CB00;
            color: #2A7221;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .dashboard-main {
                margin-left: 0;
            }
            
            .dashboard-sidebar {
                transform: translateX(-100%);
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <!-- Sidebar will be loaded dynamically -->

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="dashboard-header">
                <div class="header-left">
                    <h1>Pending Admin Approval</h1>
                    <img src="../../Logo/DLSP_Logo.png" alt="DLSP Logo" class="header-logo">
                </div>
            </div>
            <div class="dashboard-content">
                <!-- Tab Buttons -->
                <div class="resource-tabs">
                    <button class="tab-btn active" data-filter="all">All</button>
                    <button class="tab-btn" data-filter="rooms">Rooms</button>
                    <button class="tab-btn" data-filter="chemicals">Chemicals</button>
                    <button class="tab-btn" data-filter="assets">Assets</button>
                </div>
                
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Resources</th>
                                <th>Student</th>
                                <th>Additional Note</th>
                                <th>Status</th>
                                <!-- <th>Actions</th> -->
                            </tr>
                        </thead>
                        <tbody id="reservationsTable">
                            <!-- Data will be loaded dynamically -->
                        </tbody>
                    </table>
                </div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon"></div>
                    <div class="empty-state-text">No Reservation.</div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../js/sidebar_loader.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/professor_pending.js"></script>
</body>

</html>
