<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation History - Student</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/sidebar_theme.css">
    <style>
        #studentHistoryModal .modal-content { width: min(92vw, 760px); max-width: 760px; }
        .history-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .history-detail-grid > div { display: grid; gap: 4px; padding: 12px; background: #f4f8f2; border-radius: 8px; }
        .history-detail-grid strong, .history-detail-heading, .history-detail-note strong { color: #1e441e; }
        .history-detail-grid span { overflow-wrap: anywhere; }
        .history-detail-heading { margin: 22px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #2a7221; }
        .history-detail-resources { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
        .history-detail-resource { padding: 14px; background: #f4f8f2; border-left: 3px solid #31cb00; border-radius: 8px; }
        .history-detail-resource h3 { margin: 0 0 8px; font-size: 1rem; }
        .history-detail-resource p { margin: 4px 0; }
        .history-detail-note { margin-top: 16px; padding: 12px; background: #fff8e8; border-radius: 8px; }
        .history-detail-note p { margin-top: 6px; white-space: pre-wrap; }
        @media (max-width: 600px) { .history-detail-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="dashboard-header">
                <div class="header-left">
                    <h1>Reservation History</h1>
                    <img src="../../Logo/DLSP_Logo.png" alt="DLSP Logo" class="header-logo">
                </div>
            </div>
            <div class="dashboard-content">
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Resources</th>
                                <th>Year & Section</th>
                                <th>Course</th>
                                <th>Professor</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reservationsTable">
                            <!-- Data will be loaded dynamically -->
                        </tbody>
                    </table>
                </div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon"></div>
                    <div class="empty-state-text">No reservations found</div>
                </div>
            </div>
        </main>
    </div>
    <div id="studentHistoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Reservation Details</h2>
                <button class="modal-close" type="button" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../js/sidebar_loader.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/modal.js"></script>
    <script src="../../js/student_history.js"></script>
</body>

</html>
