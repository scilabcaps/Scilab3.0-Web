<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Approvals - Student</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/sidebar_theme.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="dashboard-header">
                <div class="header-left">
                    <h1>Pending Approvals</h1>
                    <img src="../../Logo/DLSP_Logo.png" alt="DLSP Logo" class="header-logo">
                </div>
            </div>
            <div class="dashboard-content">
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Resources</th>
                                <th>Year & Section</th>
                                <th>Course</th>
                                <th>Professor</th>
                                <th>Approval Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reservationsTable">
                            <!-- Data will be loaded dynamically -->
                        </tbody>
                    </table>
                </div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon"></div>
                    <div class="empty-state-text">No pending reservations</div>
                </div>
        </main>
    </div>
    <!-- View Details Modal -->
    <div id="viewModal" class="modal">
        <div class="modal-content reservation-dialog-content">
            <div class="modal-header">
                <h2 class="modal-title">Reservation Details</h2>
                <button type="button" class="modal-close" aria-label="Close" onclick="studentPending.closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content will be dynamically inserted -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../config/supabase.js"></script>
    <script src="../../js/sidebar_loader.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/student-pending.js"></script>
</body>

</html>
